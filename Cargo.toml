[workspace]
members = ["vmm", "devices"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Unlicense"

[package]
name = "templeos"
version = "0.1.0"
edition.workspace = true
description = "TempleOS V5.03 in a single Windows executable"

[dependencies]
vmm = { path = "vmm" }
devices = { path = "devices" }
windows = { version = "0.58", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Foundation"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
sha2 = "0.11.0"
