[workspace]
members = ["vmm", "devices", "softcpu"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Unlicense"

[package]
name = "templeos"
version = "0.1.0"
edition.workspace = true
description = "TempleOS V5.03 in a single Windows executable"

[dependencies]
sha2 = "0.11.0"
vmm = { path = "vmm" }
devices = { path = "devices" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
sha2 = "0.11.0"
